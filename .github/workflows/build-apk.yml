name: Build Mobile Harness APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Select variant to build'
        required: true
        default: 'onlineDebug'
        type: choice
        options:
          - onlineDebug
          - offlineDebug
          - allDebug
          - onlineRelease
      create_release:
        description: 'Publish APK as a GitHub Release (tag)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ github.event.inputs.variant || 'onlineDebug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses & install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Download Required Runtime Bundles
        run: |
          mkdir -p dist/runtime-bundles
          BUNDLE_BASE_URL="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4"

          download_bundle() {
            local file="$1"
            if [ ! -f "dist/runtime-bundles/$file" ]; then
              echo "==> Downloading $file..."
              curl -fL --retry 3 -o "dist/runtime-bundles/$file" "$BUNDLE_BASE_URL/$file"
            else
              echo "==> $file already exists."
            fi
          }

          # The Antigravity bundle is required for all builds
          download_bundle "pocketdev-agy-arm64-2026.09.1.tar.zst"

          # Offline builds require all supplementary runtime archives
          VARIANT="${{ github.event.inputs.variant || 'onlineDebug' }}"
          if [ "$VARIANT" = "offlineDebug" ] || [ "$VARIANT" = "allDebug" ]; then
            echo "==> Downloading offline runtime bundles..."
            download_bundle "pocketdev-core-arm64-2026.09.5.tar.zst"
            download_bundle "pocketdev-claude-arm64-2026.09.1.tar.zst"
            download_bundle "pocketdev-python-arm64-2026.09.2.tar.zst"
            download_bundle "pocketdev-android-arm64-2026.09.1.tar.zst"
            download_bundle "pocketdev-dsh-arm64-2026.09.1.tar.zst"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          VARIANT="${{ github.event.inputs.variant || 'onlineDebug' }}"
          echo "Building variant: $VARIANT"
          case "$VARIANT" in
            "onlineDebug")
              ./gradlew assembleOnlineDebug --stacktrace
              ;;
            "offlineDebug")
              ./gradlew assembleOfflineDebug --stacktrace
              ;;
            "allDebug")
              ./gradlew assembleOnlineDebug assembleOfflineDebug --stacktrace
              ;;
            "onlineRelease")
              ./gradlew assembleOnlineRelease --stacktrace
              ;;
            *)
              ./gradlew assembleOnlineDebug --stacktrace
              ;;
          esac

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-${{ github.event.inputs.variant || 'onlineDebug' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Mobile Harness Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
